name: Build Universal Ludo QA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f UniversalLudoQAAndroid.zip
          rm -rf project
          mkdir -p project
          unzip -q -o UniversalLudoQAAndroid.zip -d project

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find project -type f -name 'settings.gradle.kts' -print -quit)"
          test -n "$ROOT"
          PROJECT_DIR="$(dirname "$ROOT")"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms/android-35"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Verify APK exists
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLudoQA-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLudoQA-build-reports
          path: |
            project/**/build/reports/**
            project/**/build/outputs/logs/**
          if-no-files-found: ignore
