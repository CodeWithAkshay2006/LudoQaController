name: Build Universal Ludo QA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          rm -rf project
          mkdir -p project
          unzip -o UniversalLudoQAAndroid.zip -d project

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$ROOT")"
          echo "Gradle project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLudoQA-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
